<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parts App</title>
<style>
:root{--bg:#f6f7f9;--fg:#1a1d21;--card:#fff;--line:#dde1e6;--acc:#1f6feb;--mut:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8eaed;--card:#1a1e24;--line:#2c323a;--acc:#4c8dff;--mut:#9aa3ad}}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
nav{display:flex;gap:6px;padding:10px 20px}
main{padding:0 20px 40px;max-width:900px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:12px 0}
.narrow{max-width:380px;margin:80px auto}
label{display:block;margin:10px 0;font-size:13px;color:var(--mut)}
input,select{display:block;width:100%;padding:8px;margin-top:4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.chk{display:flex;gap:8px;align-items:center;color:var(--fg);font-size:14px}
.chk input{width:auto;margin:0}
button{padding:8px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
button.ghost,nav button{background:transparent;color:var(--fg);border:1px solid var(--line)}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
fieldset{border:1px solid var(--line);border-radius:8px;margin:10px 0}
.row{display:flex;gap:8px}
.muted{color:var(--mut)}
#printArea{display:none}
.doc table{width:100%}.doc{color:#000}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}body{background:#fff}}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(
  'https://hspidkttwiraciusexna.supabase.co',
  'sb_publishable_5W1UseL5sN4us1mswAdH-A_YwhJXvu5'
);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
const msg = (t, good) => {
  let b = $('#toast');
  if (!b) { b = document.createElement('div'); b.id = 'toast';
    b.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);max-width:90%;padding:10px 16px;border-radius:8px;background:#b42318;color:#fff;z-index:9;font-size:14px';
    document.body.appendChild(b); }
  b.textContent = t; b.style.background = good ? '#1a7f37' : '#b42318'; clearTimeout(b._t); b._t = setTimeout(() => b.remove(), 10000);
};
let me, biz, myPerms = new Set(), page = 'business', editId = null, staff = [];
const isOwner = () => me.role === 'owner';
const can = k => isOwner() || myPerms.has(k);

/* ---------- auth ---------- */
function renderAuth() {
  app.innerHTML = `<div class="card narrow"><h1>Parts App</h1>
    <label>Email<input id="em" type="email"></label>
    <label>Password<input id="pw" type="password"></label>
    <div class="row"><button onclick="signIn()">Sign in</button>
    <button class="ghost" onclick="signUp()">Create account</button></div></div>`;
}
async function signIn() {
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
  if (error) msg(error.message); else load();
}
async function signUp() {
  const { data, error } = await sb.auth.signUp({ email: $('#em').value, password: $('#pw').value });
  if (error) return msg(error.message);
  if (data.session) load(); else msg('Check your email to confirm your account, then sign in.');
}
async function signOut() { await sb.auth.signOut(); renderAuth(); }

function renderRegister() {
  app.innerHTML = `<div class="card narrow"><h1>Set up your business</h1>
    <label>Business name<input id="bn"></label>
    <label>Your full name<input id="fn"></label>
    <div class="row"><button onclick="register()">Create business</button>
    <button class="ghost" onclick="signOut()">Sign out</button></div></div>`;
}
async function register() {
  const bn = $('#bn').value.trim(), fn = $('#fn').value.trim();
  if (!bn || !fn) return msg('Enter both the business name and your full name');
  try {
    const { error } = await sb.rpc('register_business', { p_business_name: bn, p_full_name: fn });
    if (error) return msg('Could not create business: ' + error.message);
    me = null; await load();
    if (!me) msg('Business created, but your profile could not be loaded. Refresh the page.');
  } catch (e) { msg('Unexpected error: ' + e.message); }
}

/* ---------- load + shell ---------- */
async function load(retry = true) {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return renderAuth();
  const { data: p, error: pe } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (pe) msg('Could not load profile: ' + pe.message);
  if (!p) {
    const { data: joined, error: ie } = await sb.rpc('accept_invite');
    if (ie) msg('Invite check failed: ' + ie.message);
    if (joined && retry) return load(false);
    return renderRegister();
  }
  me = p;
  const { data: b } = await sb.from('businesses').select('*').eq('id', p.business_id).single();
  biz = b;
  const { data: perms } = await sb.rpc('my_permissions');
  myPerms = new Set(perms || []);
  go('business');
}
function shell() {
  app.innerHTML = `<header><b>${esc(biz.name)}</b><span>${esc(me.full_name)} (${me.role})
    <button class="ghost" onclick="signOut()">Sign out</button></span></header>
    <nav>${navPages().map(p =>
      `<button class="${p === page ? 'on' : ''}" onclick="go('${p}')">${navNames[p] || p[0].toUpperCase() + p.slice(1)}</button>`).join('')}</nav>
    <main id="main"></main>`;
}
async function go(p) {
  page = p; editId = null; shell();
  await ({ business: pBusiness, branches: pBranches, sales: pSales, customers: pCustomers, wages: pWages, purchasing: pPurchasing, dayend: pDayend, reports: pReports, commission: pCommission, commissions: pCommissions, stock: pStock, vehicles: pVehicles, staff: pStaff })[p]();
}

/* ---------- business ---------- */
const bizFields = [['name','Business name'],['trading_name','Trading name'],['vat_number','VAT number'],['vat_rate','VAT rate (%)'],['address','Address'],['phone','Phone'],['email','Email']];
async function pBusiness() {
  const ro = isOwner() ? '' : 'disabled';
  $('#main').innerHTML = `<div class="card"><h2>Business details</h2>
    ${bizFields.map(([k, l]) => `<label>${l}<input id="b_${k}" value="${esc(biz[k])}" ${ro}></label>`).join('')}
    ${isOwner() ? '<button onclick="saveBiz()">Save</button>' : '<p class="muted">Only the owner can edit these.</p>'}</div><div id="numbers"></div>`;
  loadNumbering();
}
async function saveBiz() {
  const u = {};
  bizFields.forEach(([k]) => u[k] = $('#b_' + k).value.trim() || null);
  u.name = u.name || biz.name;
  u.vat_rate = Number(u.vat_rate || 15);
  const { data, error } = await sb.from('businesses').update(u).eq('id', biz.id).select().single();
  if (error) return msg(error.message);
  biz = data; shell(); pBusiness(); msg('Saved');
}

/* ---------- branches ---------- */
async function pBranches() {
  const { data } = await sb.from('branches').select('*').order('created_at');
  const canBr = ['owner', 'manager'].includes(me.role);
  $('#main').innerHTML = `<div class="card"><h2>Branches</h2><table>
    <tr><th>Name</th><th>Address</th><th>Status</th><th></th></tr>
    ${(data || []).map(b => `<tr><td>${esc(b.name)}</td><td>${esc(b.address)}</td>
      <td>${b.active ? 'Active' : 'Inactive'}</td>
      <td>${canBr ? `<button class="ghost" onclick="toggleBranch('${b.id}',${!b.active})">${b.active ? 'Deactivate' : 'Activate'}</button>` : ''}</td></tr>`).join('')}
    </table></div>
    ${canBr ? `<div class="card"><h3>Add a branch</h3>
      <label>Name<input id="nb_name"></label><label>Address<input id="nb_addr"></label>
      <button onclick="addBranch()">Add branch</button></div>` : ''}`;
}
async function addBranch() {
  const name = $('#nb_name').value.trim();
  if (!name) return msg('Enter a branch name');
  const { error } = await sb.from('branches').insert({ business_id: me.business_id, name, address: $('#nb_addr').value.trim() || null });
  if (error) msg(error.message); else pBranches();
}
async function toggleBranch(id, active) {
  const { error } = await sb.from('branches').update({ active }).eq('id', id);
  if (error) msg(error.message); else pBranches();
}

/* ---------- staff + permissions ---------- */
async function pStaff() {
  const { data } = await sb.from('profiles').select('*').order('full_name');
  staff = data || [];
  let inv = [];
  if (can('staff.manage_users')) {
    const r = await sb.from('staff_invites').select('*').is('accepted_at', null).order('created_at');
    inv = r.data || [];
  }
  $('#main').innerHTML = `<div class="card"><h2>Staff</h2><table>
    <tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr>
    ${staff.map(s => `<tr><td>${esc(s.full_name)}</td><td>${s.role}</td><td>${s.active ? 'Active' : 'Inactive'}</td>
      <td><button class="ghost" onclick="editStaff('${s.id}')">Open</button></td></tr>`).join('')}
    </table></div>${can('staff.manage_users') ? inviteCard(inv) : ''}<div id="editor"></div>`;
  if (editId) await renderEditor();
}
function inviteCard(inv) {
  return `<div class="card"><h3>Invite staff</h3>
    <label>Email<input id="i_email" type="email"></label>
    <label>Full name<input id="i_name"></label>
    <label>Role<select id="i_role">${['manager', 'rep', 'counter', 'technician', 'accounts'].map(r => `<option>${r}</option>`).join('')}</select></label>
    <button onclick="sendInvite()">Save invite</button>
    ${inv.length ? `<h4>Pending invites</h4><table>${inv.map(i => `<tr><td>${esc(i.full_name)}</td><td>${esc(i.email)}</td><td>${i.role}</td>
      <td><button class="ghost" onclick="cancelInvite('${i.id}')">Cancel</button></td></tr>`).join('')}</table>` : ''}
    <p class="muted">They sign up at ${esc(location.origin)} using this exact email and are added to your business automatically.</p></div>`;
}
async function sendInvite() {
  const email = $('#i_email').value.trim().toLowerCase(), full_name = $('#i_name').value.trim();
  if (!email || !full_name) return msg('Enter their email and full name');
  const { error } = await sb.from('staff_invites').insert({ business_id: me.business_id, branch_id: me.branch_id, email, full_name, role: $('#i_role').value });
  if (error) return msg(error.message);
  await pStaff();
}
async function cancelInvite(id) {
  const { error } = await sb.from('staff_invites').delete().eq('id', id);
  if (error) msg(error.message);
  await pStaff();
}
async function editStaff(id) { editId = id; await renderEditor(); $('#editor').scrollIntoView(); }
async function renderEditor() {
  const s = staff.find(x => x.id === editId); if (!s) return;
  const [{ data: cat }, { data: ticks }] = await Promise.all([
    sb.from('permissions').select('*').order('group_name').order('sort'),
    sb.from('user_permissions').select('permission_key').eq('user_id', s.id)]);
  const on = new Set((ticks || []).map(t => t.permission_key));
  const target = s.role === 'owner', self = s.id === me.id;
  const canEdit = can('staff.manage_users') && !target && !self;
  const canTick = can('staff.assign_permissions') && !target && !self;
  const dis = canEdit ? '' : 'disabled';
  const groups = {};
  (cat || []).forEach(p => (groups[p.group_name] = groups[p.group_name] || []).push(p));
  const showPerms = can('staff.assign_permissions');
  if (!showPerms) Object.keys(groups).forEach(k => delete groups[k]);
  $('#editor').innerHTML = `<div class="card"><h2>${esc(s.full_name)}</h2>
    <label>Full name<input id="e_name" value="${esc(s.full_name)}" ${dis}></label>
    <label>Phone<input id="e_phone" value="${esc(s.phone)}" ${dis}></label>
    <label>Role<select id="e_role" ${dis}>
      ${target ? '<option selected>owner</option>' : ''}
      ${['manager', 'rep', 'counter', 'technician', 'accounts'].map(r => `<option ${r === s.role ? 'selected' : ''}>${r}</option>`).join('')}
    </select></label>
    <label class="chk"><input type="checkbox" id="e_active" ${s.active ? 'checked' : ''} ${dis}> Active</label>
    ${canEdit ? `<button onclick="saveStaff('${s.id}')">Save details</button>` : ''}
    ${showPerms ? '<h3>Permissions</h3>' : ''}
    ${target && showPerms ? '<p class="muted">Owners always have every permission.</p>' : ''}
    ${Object.entries(groups).map(([g, ps]) => `<fieldset><legend>${esc(g)}</legend>
      ${ps.map(p => `<label class="chk"><input type="checkbox" ${on.has(p.key) ? 'checked' : ''}
        ${canTick && can(p.key) ? '' : 'disabled'} onchange="tick('${s.id}','${p.key}',this.checked)"> ${esc(p.label)}</label>`).join('')}
    </fieldset>`).join('')}
    ${canTick ? `<button class="ghost" onclick="resetPerms('${s.id}')">Reset to role defaults</button>` : ''}</div>`;
}
async function saveStaff(id) {
  const { error } = await sb.from('profiles').update({
    full_name: $('#e_name').value.trim(), phone: $('#e_phone').value.trim() || null,
    role: $('#e_role').value, active: $('#e_active').checked }).eq('id', id);
  if (error) return msg(error.message);
  await pStaff();
}
async function tick(uid, key, on) {
  const r = on
    ? await sb.from('user_permissions').insert({ user_id: uid, business_id: me.business_id, permission_key: key })
    : await sb.from('user_permissions').delete().eq('user_id', uid).eq('permission_key', key);
  if (r.error) msg(r.error.message);
  await renderEditor();
}
async function resetPerms(id) {
  const { error } = await sb.rpc('apply_role_defaults', { p_user: id });
  if (error) msg(error.message);
  await renderEditor();
}


/* ---------- stock + vehicles ---------- */
const navPages = () => ['business', 'branches',
  ...(canSales() ? ['sales'] : []),
  ...(canSales() || can('accounts.customer_accounts') ? ['customers'] : []),
  ...(canRecon() ? ['dayend'] : []),
  ...(can('staff.view_wages') || can('staff.manage_wages') ? ['wages'] : []),
  ...(['owner', 'manager'].includes(me.role) || can('accounts.view_reports') ? ['reports'] : []),
  ...(can('stock.view') ? ['stock'] : []),
  ...(canBuy() ? ['purchasing'] : []),
  ...(can('stripping.buy_car') ? ['vehicles'] : []),
  ...(['owner', 'manager'].includes(me.role) ? ['commission'] : []),
  ...(['owner', 'manager'].includes(me.role) || can('accounts.view_reports') || can('sales.view_own_commission') ? ['commissions'] : []),
  ...(can('staff.manage_users') || can('staff.assign_permissions') ? ['staff'] : [])];
const R = n => 'R ' + Number(n || 0).toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let stockQ = '', stripV = null, stripItems = [];

async function pStock() {
  $('#main').innerHTML = `<div class="card"><h2>Stock</h2>
    <div class="row"><input id="sq" placeholder="Search e.g. rear taillight grand cherokee" value="${esc(stockQ)}" onkeydown="if(event.key==='Enter')runSearch()">
    <button onclick="runSearch()">Search</button></div><div id="results"></div></div>
    <div id="partPanel"></div>${can('stock.edit') ? newPartCard() : ''}`;
  await runSearch();
}
async function runSearch() {
  stockQ = $('#sq').value;
  const { data, error } = await sb.rpc('search_parts', { q: stockQ }).limit(100);
  if (error) return msg(error.message);
  const vc = can('stock.view_cost'), costs = {};
  if (vc && data.length) {
    const r = await sb.from('part_costs').select('part_id,avg_cost').in('part_id', data.map(p => p.id));
    (r.data || []).forEach(c => costs[c.part_id] = c.avg_cost);
  }
  $('#results').innerHTML = data.length ? `<table><tr><th>Code</th><th>Part</th><th>Bin</th><th>Price</th>${vc ? '<th>Avg cost</th>' : ''}<th>Qty</th><th></th></tr>
    ${data.map(p => `<tr><td>${p.code}</td><td>${esc(p.name)}<div class="muted">${esc(p.specs)}</div></td><td>${esc(p.bin_location)}</td>
      <td>${R(p.sell_price)}</td>${vc ? `<td>${R(costs[p.id])}</td>` : ''}<td>${p.qty}</td>
      <td><button class="ghost" onclick="openPart('${p.id}')">Open</button></td></tr>`).join('')}</table>` : '<p class="muted">No parts found.</p>';
}
async function openPart(id) {
  const { data: p } = await sb.from('parts').select('*').eq('id', id).single();
  const { data: h } = await sb.rpc('part_history', { p_part: id });
  const vc = can('stock.view_cost'), ed = can('stock.edit'), adj = can('stock.adjust'), d = ed ? '' : 'disabled';
  $('#partPanel').innerHTML = `<div class="card"><h2>${p.code} - ${esc(p.name)}</h2>
    <label>Name<input id="p_name" value="${esc(p.name)}" ${d}></label>
    <label>Specs<input id="p_specs" value="${esc(p.specs)}" ${d}></label>
    <label>Bin location<input id="p_bin" value="${esc(p.bin_location)}" ${d}></label>
    <label>Selling price<input id="p_price" type="number" step="0.01" value="${p.sell_price}" ${d}></label>
    ${ed ? `<button onclick="savePart('${p.id}')">Save</button>` : ''}
    ${adj ? `<h3>Add stock</h3><div class="row"><input id="a_qty" type="number" placeholder="Quantity">
      <input id="a_cost" type="number" step="0.01" placeholder="Unit cost"><input id="a_src" placeholder="Supplier or source"></div>
      <button onclick="addStock('${p.id}')">Receive stock</button>` : ''}
    <h3>Stock history</h3><table><tr><th>Date</th><th>Type</th><th>Qty</th><th>Source</th>${vc ? '<th>Cost</th>' : ''}</tr>
    ${(h || []).map(m => `<tr><td>${new Date(m.created_at).toLocaleDateString()}</td><td>${m.kind}</td><td>${m.qty_change}</td>
      <td>${esc(m.source || m.note)}</td>${vc ? `<td>${m.unit_cost == null ? '' : R(m.unit_cost)}</td>` : ''}</tr>`).join('')}</table></div>`;
  $('#partPanel').scrollIntoView();
}
async function savePart(id) {
  const { error } = await sb.from('parts').update({ name: $('#p_name').value.trim(), specs: $('#p_specs').value.trim() || null,
    bin_location: $('#p_bin').value.trim() || null, sell_price: Number($('#p_price').value || 0) }).eq('id', id);
  if (error) return msg(error.message);
  msg('Saved', true); await runSearch();
}
async function addStock(id) {
  const q = Number($('#a_qty').value), c = $('#a_cost').value;
  const { error } = await sb.rpc('add_stock_movement', { p_part: id, p_qty: q, p_unit_cost: c === '' ? null : Number(c),
    p_kind: 'receive', p_source: $('#a_src').value.trim() || null, p_note: null });
  if (error) return msg(error.message);
  msg('Stock added', true); await runSearch(); await openPart(id);
}
function newPartCard() {
  return `<div class="card"><h3>Add a part manually</h3>
    <div class="row"><select id="np_kind"><option value="new">New (N)</option><option value="used">Used (U)</option></select>
    <input id="np_name" placeholder="Name"></div><label>Specs<input id="np_specs"></label>
    <div class="row"><input id="np_cat" placeholder="Category"><input id="np_bin" placeholder="Bin">
    <input id="np_price" type="number" step="0.01" placeholder="Selling price"></div>
    <button onclick="createPart()">Create part</button></div>`;
}
async function createPart() {
  const name = $('#np_name').value.trim();
  if (!name) return msg('Enter a part name');
  const { error } = await sb.rpc('create_part', { p_kind: $('#np_kind').value, p_name: name, p_specs: $('#np_specs').value.trim() || null,
    p_category: $('#np_cat').value.trim() || null, p_bin: $('#np_bin').value.trim() || null, p_price: Number($('#np_price').value || 0) });
  if (error) return msg(error.message);
  stockQ = name; await pStock(); msg('Part created. Use Open, then Add stock to receive quantity.', true);
}

const vLabel = v => [v.year, v.make, v.model, v.series].filter(Boolean).join(' ');
async function pVehicles() {
  const { data } = await sb.from('vehicles').select('*').order('created_at', { ascending: false });
  const f = [['make','Make'],['model','Model'],['series','Series (e.g. WK2)'],['year','Year'],['engine','Engine'],['transmission','Transmission'],
    ['vin','VIN'],['registration','Registration'],['colour','Colour'],['mileage','Mileage'],['purchase_price','Purchase price'],['extra_costs','Extra costs (towing etc.)']];
  $('#main').innerHTML = `<div class="card"><h2>Vehicles</h2>${(data || []).length ? `<table>
    <tr><th>Bought</th><th>Vehicle</th><th>Reg</th><th>Total cost</th><th>Status</th><th></th></tr>
    ${data.map(v => `<tr><td>${v.purchased_on}</td><td>${esc(vLabel(v))}</td><td>${esc(v.registration)}</td>
      <td>${R(Number(v.purchase_price) + Number(v.extra_costs))}</td><td>${v.status}</td>
      <td>${v.status === 'purchased' && can('stripping.import_parts') ? `<button onclick="startStrip('${v.id}')">Strip</button>` : ''}</td></tr>`).join('')}
    </table>` : '<p class="muted">No vehicles yet.</p>'}</div>
    <div class="card"><h3>Buy a vehicle for stripping</h3>
    ${f.map(([k, l]) => `<label>${l}<input id="v_${k}"></label>`).join('')}
    <button onclick="addVehicle()">Save vehicle</button></div>`;
}
async function addVehicle() {
  const g = k => $('#v_' + k).value.trim(), num = k => g(k) === '' ? null : Number(g(k));
  if (!g('make') || !g('model')) return msg('Enter at least the make and model');
  const { error } = await sb.from('vehicles').insert({ business_id: me.business_id, make: g('make'), model: g('model'),
    series: g('series') || null, year: num('year'), engine: g('engine') || null, transmission: g('transmission') || null,
    vin: g('vin') || null, registration: g('registration') || null, colour: g('colour') || null, mileage: num('mileage'),
    purchase_price: num('purchase_price') ?? 0, extra_costs: num('extra_costs') ?? 0 });
  if (error) return msg(error.message);
  await pVehicles(); msg('Vehicle saved. Click Strip to split it into parts.', true);
}

async function startStrip(id) {

function toggleItem(ix, el) {

function addExtra() {
  const n = $('#x_name').value.trim(); if (!n) return;

}
async function confirmStrip(force) {
  const items = stripItems.filter(i => i.on).map(i => ({ name: i.name, category: i.category, price: Number(i.price || 0), bin: i.bin || null }));
  if (!items.length) return msg('Tick at least one part');
  const unpriced = items.filter(i => !(i.price > 0));
  if (unpriced.length && force !== true) {
    const all = unpriced.length === items.length;
    const names = esc(unpriced.slice(0, 10).map(i => i.name).join(', ')) + (unpriced.length > 10 ? ' and more' : '');
    $('#stripWarn').innerHTML = `<div class="card" style="border-color:#b54708"><h3>Parts without a price</h3>
      <p>${all ? 'None of the ticked parts have a selling price, so the cost of the car will be split equally between them.'
        : `${unpriced.length} ticked part${unpriced.length > 1 ? 's have' : ' has'} no selling price and will carry no cost: ${names}. The whole cost of the car will be spread over the priced parts only.`}</p>
      <div class="row"><button onclick="confirmStrip(true)">Continue anyway</button>
      <button class="ghost" onclick="$('#stripWarn').innerHTML=''">Go back and add prices</button></div></div>`;
    $('#stripWarn').scrollIntoView({ block: 'center' });
    return;
  }
  const { data, error } = await sb.rpc('strip_vehicle', { p_vehicle: stripV.id, p_items: items });
  if (error) return msg(error.message);
  stockQ = ''; await go('stock'); msg(data + ' parts added to stock', true);
}

async function partSearch() {

/* ---------- commission settings ---------- */
const CFIELDS = [['total', 'Invoice total (incl. VAT)'], ['vat', 'VAT'], ['delivery', 'Delivery / courier'], ['labour', 'Labour'], ['other', 'Other lines'],
  ['new_parts_sales', 'New parts sales'], ['used_parts_sales', 'Used parts sales'], ['new_parts_cost', 'New parts cost'],
  ['used_parts_cost', 'Used parts cost'], ['buyout_cost', 'Buy-out cost']];
const clabel = k => (CFIELDS.find(f => f[0] === k) || [k, k])[1];
let cm = null, cmInv = [];
async function pCommission() {
  const [{ data, error }, inv] = await Promise.all([sb.rpc('get_commission_settings'),
    sb.from('invoices').select('id,ref,customer_name,total').neq('status', 'void').order('created_at', { ascending: false }).limit(25)]);
  if (error) return msg(error.message);

function cmToggle(k, on) {
  cm.components = cm.components.filter(c => c.field !== k);
  if (on) cm.components.push({ field: k, sign: ['total', 'new_parts_sales', 'used_parts_sales'].includes(k) ? 1 : -1 });

function cmSign(k, v) { cm.components.find(c => c.field === k).sign = Number(v); renderCommission(); }
function eqText() {

}
function renderCommission() {

function barChart(labels, series) {
  const W = 640, H = 230, pl = 56, pb = 26, pt = 10, n = labels.length, colors = ['#1f6feb', '#2da44e', '#bf8700', '#cf222e', '#8250df', '#0a7ea4', '#bc4c00', '#6e7781'];
  const max = Math.max(1, ...series.flatMap(x => x.values.map(Number))), gw = (W - pl) / n, bw = Math.max(2, gw * 0.8 / series.length);
  let g = '';
  for (let t = 0; t <= 4; t++) {
    const y = pt + (H - pt - pb) * (1 - t / 4);
    g += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl - 4}" y="${y + 4}" font-size="10" text-anchor="end" fill="var(--mut)">${Math.round(max * t / 4).toLocaleString('en-ZA')}</text>`;
  }
  series.forEach((x, si) => x.values.forEach((v, i) => {
    const h = (H - pt - pb) * Math.max(0, Number(v)) / max;
    g += `<rect x="${pl + i * gw + gw * 0.1 + si * bw}" y="${H - pb - h}" width="${bw}" height="${h}" fill="${colors[si % 8]}"><title>${esc(x.name)} ${labels[i]}: ${R(v)}</title></rect>`;
  }));
  labels.forEach((l, i) => g += `<text x="${pl + i * gw + gw / 2}" y="${H - 10}" font-size="10" text-anchor="middle" fill="var(--mut)">${esc(l)}</text>`);
  const legend = series.map((x, si) => `<span style="margin-right:12px"><span style="display:inline-block;width:10px;height:10px;background:${colors[si % 8]}"></span> ${esc(x.name)}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div class="muted">${legend}</div>`;
}

    <tr><td><b>Year</b></td><td><b>${tot('count')}</b></td><td><b>${R(tot('sales'))}</b></td><td><b>${R(tot('received'))}</b></td><td><b>${R(tot('expenses'))}</b></td><td><b>${R(tot('commission'))}</b></td><td><b>${R(tot('nett'))}</b></td></tr></table></div>`;

async function repReps() {
  const { data, error } = await sb.rpc('rep_report', { p_month: rp.month + '-01' });
  if (error) return msg(error.message);
  const mo = Number(rp.month.slice(5)), Y = data.year_rows, Wk = data.week_rows, sum = (rows, k) => rows.reduce((a, r) => a + Number(r[k]), 0);
  const reps = [...new Set([...Y, ...Wk].map(r => r.rep))].sort();
  const cols = [1, 2, 3, 4].map(w => rep => sum(Wk.filter(r => r.rep === rep && r.week === w), 'sales'))
    .concat([rep => sum(Y.filter(r => r.rep === rep && r.month === mo), 'sales'), rep => sum(Y.filter(r => r.rep === rep), 'sales')]);
  const top = f => { let best = '-', bv = 0; reps.forEach(r => { if (f(r) > bv) { bv = f(r); best = r; } }); return best; };
  $('#rp_out').innerHTML = `<div class="card"><h3>Sales by rep (incl. VAT)</h3><table><tr><th>Rep</th><th>Week 1</th><th>Week 2</th><th>Week 3</th><th>Week 4</th><th>Month</th><th>Year</th></tr>
    ${reps.map(r => `<tr><td>${esc(r)}</td>${cols.map(f => `<td>${R(f(r))}</td>`).join('')}</tr>`).join('')}
    <tr><td><b>Top rep</b></td>${cols.map(f => `<td><b>${esc(top(f))}</b></td>`).join('')}</tr></table></div>
    <div class="card"><h3>Commission earned</h3><table><tr><th>Rep</th><th>This month</th><th>This year</th></tr>
    ${reps.map(r => `<tr><td>${esc(r)}</td><td>${R(sum(Y.filter(x => x.rep === r && x.month === mo), 'commission'))}</td><td>${R(sum(Y.filter(x => x.rep === r), 'commission'))}</td></tr>`).join('')}</table></div>
    <div class="card"><h3>Monthly sales by rep, ${rp.month.slice(0, 4)}</h3>${barChart(MONTHS, reps.map(r => ({ name: r, values: MONTHS.map((_, i) => sum(Y.filter(x => x.rep === r && x.month === i + 1), 'sales')) })))}</div>`;
}

function impCalc() {
  const r = Number(im.rate || 0), n = v => Number(v || 0), costs = im.costs.reduce((a, c) => a + n(c.amount), 0);
  const goodsOf = l => n(l.qty) * n(l.unit_foreign) * r;
  const basis = l => im.alloc === 'value' ? goodsOf(l) : im.alloc === 'quantity' ? n(l.qty) : n(l.qty) * n(l.weight_kg);
  const tb = im.lines.reduce((a, l) => a + basis(l), 0), goods = im.lines.reduce((a, l) => a + goodsOf(l), 0);
  return { costs, goods, landed: im.lines.map(l => n(l.qty) > 0 ? Math.round((goodsOf(l) + (tb > 0 ? costs * basis(l) / tb : 0)) / n(l.qty) * 100) / 100 : 0), spreadable: tb > 0 };
}
function impTotals() {
  const c = impCalc();
  im.lines.forEach((l, i) => { const e = $('#im_lu' + i); if (e) e.textContent = R(c.landed[i]); });
  $('#im_tot').innerHTML = `Goods: <b>${R(c.goods)}</b> | Extra costs: <b>${R(c.costs)}</b> | Total landed: <b>${R(c.goods + c.costs)}</b>

}

      ${[['value', 'Value of the goods'], ['quantity', 'Quantity'], ['weight', 'Weight']].map(([k, l]) => `<option value="${k}" ${im.alloc === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label>Expected on<input type="date" value="${esc(im.expected_on)}" oninput="im.expected_on=this.value"></label>

    <button onclick="impSearch()">Search</button>
    <button class="ghost" onclick="im.lines.push({part_id:null,description:'',specs:'',qty:1,unit_foreign:'',weight_kg:'',sell_price:''});renderImportEdit()">+ New part</button></div><div id="ip_r"></div>
    <table><tr><th>Part</th><th>Qty</th><th>Unit price</th>${wt ? '<th>Weight kg each</th>' : ''}<th>Selling price (R)</th><th>Landed cost each</th><th></th></tr>
    ${im.lines.map((l, i) => `<tr><td><input value="${esc(l.description)}" ${l.part_id ? 'disabled' : 'placeholder="New part name"'} oninput="im.lines[${i}].description=this.value"></td>
      <td><input type="number" style="width:70px" value="${l.qty}" oninput="im.lines[${i}].qty=this.value;impTotals()"></td>

      <td><input type="number" step="0.01" style="width:100px" value="${esc(l.sell_price)}" ${l.part_id ? 'disabled' : ''} oninput="im.lines[${i}].sell_price=this.value"></td>

    <div class="card"><h3>Extra costs (in rand)</h3><p class="muted">Freight, duty, clearing and similar. Import VAT is claimed back, so leave it out.</p>
    ${im.costs.map((c, i) => `<div class="row" style="align-items:center;margin:4px 0"><select onchange="im.costs[${i}].kind=this.value">${IMKINDS.map(k => `<option ${k === c.kind ? 'selected' : ''}>${k}</option>`).join('')}</select>

/* ---------- staff leave ---------- */
let lvEmp = null, lvYear = new Date().getFullYear();
const LVTYPES = ['annual', 'sick', 'family', 'unpaid', 'other'];
async function loadLeave(y) {
  const { data } = await sb.from('leave_records').select('*').gte('start_date', y + '-01-01').lte('start_date', y + '-12-31').order('start_date');

}
function weekdays(a, b) {
  let n = 0;
  for (let d = new Date(a + 'T00:00'); d <= new Date(b + 'T00:00'); d.setDate(d.getDate() + 1)) { const k = d.getDay(); if (k !== 0 && k !== 6) n++; }
  return n;
}
function leaveCalc() {
  const a = $('#lv_from').value, b = $('#lv_to').value || a;
  if (a && b && b >= a) $('#lv_days').value = weekdays(a, b);
}
async function leaveOpen(id, y) {

  const e = emps.find(x => x.id === id), recs = (await loadLeave(lvYear)).filter(r => r.employee_id === id), w = can('staff.manage_wages');
  const taken = t => recs.filter(r => r.leave_type === t).reduce((a, r) => a + Number(r.days), 0);
  const ent = { annual: e.annual_days, sick: e.sick_days, family: e.family_days }, Y = new Date().getFullYear();
  $('#leave_panel').innerHTML = `<div class="card"><h3>Leave: ${esc(e.full_name)}</h3>
    <label>Leave year<select onchange="leaveOpen('${id}',Number(this.value))">${[Y + 1, Y, Y - 1, Y - 2].map(y => `<option ${y === lvYear ? 'selected' : ''}>${y}</option>`).join('')}</select></label>
    <table><tr><th>Type</th><th>Entitled</th><th>Taken</th><th>Left</th></tr>
    ${['annual', 'sick', 'family'].map(t => `<tr><td>${t}</td><td>${Number(ent[t])}</td><td>${taken(t)}</td><td><b>${Number(ent[t]) - taken(t)}</b></td></tr>`).join('')}
    <tr><td>unpaid</td><td></td><td>${taken('unpaid')}</td><td></td></tr><tr><td>other</td><td></td><td>${taken('other')}</td><td></td></tr></table>
    <h3>Leave taken in ${lvYear}</h3>${recs.length ? `<table><tr><th>From</th><th>To</th><th>Type</th><th>Days</th><th>Note</th><th></th></tr>
    ${recs.map(r => `<tr><td>${fdate(r.start_date)}</td><td>${fdate(r.end_date)}</td><td>${r.leave_type}</td><td>${Number(r.days)}</td><td>${esc(r.note)}</td>
      <td>${w ? `<button class="ghost" onclick="leaveDel('${r.id}')">x</button>` : ''}</td></tr>`).join('')}</table>` : '<p class="muted">No leave recorded.</p>'}
    ${w ? `<h3>Record leave</h3><div class="row" style="align-items:end"><label>Type<select id="lv_type">${LVTYPES.map(t => `<option>${t}</option>`).join('')}</select></label>
      <label>From<input id="lv_from" type="date" onchange="leaveCalc()"></label><label>To<input id="lv_to" type="date" onchange="leaveCalc()"></label>
      <label>Days<input id="lv_days" type="number" step="0.5"></label></div>
      <p class="muted">Days are counted Monday to Friday. Change the number for half days or public holidays.</p>
      <label>Note<input id="lv_note" placeholder="e.g. doctor's note provided"></label><button onclick="leaveAdd()">Record leave</button>` : ''}</div>`;
  $('#leave_panel').scrollIntoView();
}
async function leaveAdd() {
  const a = $('#lv_from').value, b = $('#lv_to').value || a, d = Number($('#lv_days').value);
  if (!a) return msg('Choose the first day of leave');
  if (b < a) return msg('The last day is before the first day');
  if (!(d > 0)) return msg('Enter the number of leave days');
  const { error } = await sb.from('leave_records').insert({ business_id: me.business_id, employee_id: lvEmp, leave_type: $('#lv_type').value,
    start_date: a, end_date: b, days: d, note: $('#lv_note').value.trim() || null });
  if (error) return msg(error.message);
  const keep = lvEmp; msg('Leave recorded', true); await wgEmps(); await leaveOpen(keep);

async function leaveDel(id) {
  if (!confirm('Remove this leave record?')) return;
  const { error } = await sb.from('leave_records').delete().eq('id', id);
  if (error) return msg(error.message);
  const keep = lvEmp; await wgEmps(); await leaveOpen(keep);
}
async function attachLeave(lines, ws) {
  const we = isoLocal(new Date(new Date(ws + 'T00:00').getTime() + 6 * 864e5));
  const { data } = await sb.from('leave_records').select('*').lte('start_date', we).gte('end_date', ws);
  lines.forEach(l => {
    const parts = {};
    (data || []).filter(r => r.employee_id === l.employee_id).forEach(r => {
      const a = r.start_date > ws ? r.start_date : ws, b = r.end_date < we ? r.end_date : we;
      parts[r.leave_type] = (parts[r.leave_type] || 0) + weekdays(a, b);
    });
    l.leave = Object.entries(parts).map(([t, n]) => n + ' day' + (n > 1 ? 's' : '') + ' ' + t + ' leave').join(', ');
  });
}

  if (!box) return;
  if (!c || !c.is_account || doc.mode !== 'invoice') { doc.on_account = false; doc.bal = 0; box.innerHTML = ''; return; }
  const { data } = await sb.rpc('customer_balance', { p_customer: c.id });
  doc.bal = Number(data || 0); box.innerHTML = acctHtml(); refreshTotals();
}
function acctWarn() {
  const w = $('#acct_warn'), c = custs.find(x => x.id === doc.customer_id);
  if (!w || !c) return;
  const over = Number(c.credit_limit) > 0 && (doc.bal || 0) + docTotal() - docPaid() > Number(c.credit_limit);
  w.textContent = doc.on_account && (c.credit_hold || over) ? 'This is over the credit limit or the customer is on hold. Only someone with account permission can go ahead.' : '';
}

let cu = { tab: 'list', q: '' }, cuList = [], cuBal = {};
function pCustomers() {
  const b = t => `class="${cu.tab === t ? '' : 'ghost'}" onclick="cuTab('${t}')"`;
  $('#main').innerHTML = `<div class="card"><h2>Customers</h2><div class="row"><button ${b('list')}>Customers</button><button ${b('ageing')}>Ageing</button></div></div><div id="cu_out"></div>`;
  ({ list: cuListView, ageing: cuAgeing })[cu.tab]();
}
const cuTab = t => { cu.tab = t; pCustomers(); };
async function cuListView() {
  const [c, a] = await Promise.all([sb.from('customers').select('*').order('name'), sb.rpc('ageing_report')]);
  cuList = c.data || []; cuBal = {};
  (a.data || []).forEach(r => { if (r.cust_id) cuBal[r.cust_id] = Number(r.bal_total); });
  $('#cu_out').innerHTML = `<div class="card"><div class="row"><input id="cu_q" placeholder="Search name, phone or email" value="${esc(cu.q)}" oninput="cu.q=this.value;cuRows()">
    ${canSales() ? '<button onclick="cuNew()">Add customer</button>' : ''}</div><div id="cu_rows"></div></div><div id="cu_form"></div><div id="cu_detail"></div>`;
  cuRows();
}
function cuRows() {
  const q = cu.q.toLowerCase(), rows = cuList.filter(x => [x.name, x.phone, x.email].join(' ').toLowerCase().includes(q)).slice(0, 100);
  $('#cu_rows').innerHTML = `<table><tr><th>Name</th><th>Phone</th><th>Account</th><th>Owing</th><th></th></tr>
    ${rows.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${x.is_account ? 'Yes' : ''}</td><td>${cuBal[x.id] ? R(cuBal[x.id]) : ''}</td>
      <td><button class="ghost" onclick="cuOpen('${x.id}')">Open</button></td></tr>`).join('')}</table>`;
}
const CUF = [['name', 'Name'], ['phone', 'Phone'], ['email', 'Email'], ['vat_number', 'VAT number'], ['address', 'Address']];
function cuNew() {
  $('#cu_form').innerHTML = `<div class="card"><h3>New customer</h3>${CUF.map(([k, l]) => `<label>${l}<input id="cf_${k}"></label>`).join('')}<button onclick="cuSave()">Save</button></div>`;
  $('#cu_form').scrollIntoView();
}
async function cuSave() {
  const row = { business_id: me.business_id }; CUF.forEach(([k]) => row[k] = $('#cf_' + k).value.trim() || null);
  if (!row.name) return msg('Enter the customer name');
  const { error } = await sb.from('customers').insert(row);
  if (error) return msg(error.message);
  custs = []; msg('Customer saved', true); cuListView();
}
async function cuOpen(id) {
  const c = cuList.find(x => x.id === id), ca = can('accounts.customer_accounts');
  const { data: inv } = await sb.from('invoices').select('*').eq('customer_id', id).order('created_at', { ascending: false }).limit(50);
  const open = (inv || []).filter(v => v.status === 'open'), owing = open.reduce((a, v) => a + Number(v.total) - Number(v.paid), 0), d = ca ? '' : 'disabled', n = new Date();
  $('#cu_detail').innerHTML = `<div class="card"><h2>${esc(c.name)}</h2><p class="muted">${esc(c.phone)} ${esc(c.email)} ${c.vat_number ? '| VAT ' + esc(c.vat_number) : ''}<br>${esc(c.address)}</p>
    <p>Owing: <b>${R(owing)}</b></p></div>
    <div class="card"><h3>Account settings</h3><label class="chk"><input type="checkbox" id="ca_on" ${c.is_account ? 'checked' : ''} ${d}> Account customer</label>
    <div class="row"><label>Credit limit (R, 0 = none)<input id="ca_lim" type="number" step="0.01" value="${c.credit_limit}" ${d}></label>
    <label>Terms (days)<input id="ca_terms" type="number" value="${c.terms_days}" ${d}></label></div>
    <label class="chk"><input type="checkbox" id="ca_hold" ${c.credit_hold ? 'checked' : ''} ${d}> Credit hold (no new account sales)</label>
    ${ca ? `<button onclick="cuAcctSave('${id}')">Save account settings</button>` : '<p class="muted">You need account permission to change these.</p>'}</div>
    ${owing > 0 && can('till.take_payment') ? `<div class="card"><h3>Receive a payment</h3><div class="row"><select id="cp_method"><option>cash</option><option>card</option><option>eft</option></select>
      <input id="cp_amt" type="number" step="0.01" placeholder="Amount"><input id="cp_ref" placeholder="Reference"><label class="chk"><input type="checkbox" id="cp_yoco"> Yoco</label></div>
      <label>Apply to<select id="cp_inv"><option value="">Oldest invoices first</option>${open.map(v => `<option value="${v.id}">${esc(v.ref)} - owing ${R(Number(v.total) - Number(v.paid))}</option>`).join('')}</select></label>
      <button onclick="cuPay('${id}')">Apply payment</button></div>` : ''}
    <div class="card"><h3>Invoices</h3><table><tr><th>No.</th><th>Date</th><th>Due</th><th>Total</th><th>Owing</th><th>Status</th><th></th></tr>
    ${(inv || []).map(v => `<tr><td>${esc(v.ref)}</td><td>${fdate(v.created_at)}</td><td>${v.due_date ? fdate(v.due_date) : ''}</td><td>${R(v.total)}</td>
      <td>${v.status === 'open' ? R(Number(v.total) - Number(v.paid)) : ''}</td><td>${v.status}</td><td><button class="ghost" onclick="cuInv('${v.id}')">Open</button></td></tr>`).join('')}</table></div>
    <div class="card"><h3>Statement</h3><div class="row" style="align-items:end"><label>From<input id="st_from" type="date" value="${isoLocal(new Date(n.getFullYear(), n.getMonth() - 2, 1))}"></label>
    <label>To<input id="st_to" type="date" value="${isoLocal(n)}"></label><button onclick="cuStatement('${id}')">Show statement</button></div><div id="st_out"></div></div>`;
  $('#cu_detail').scrollIntoView();
}
async function cuInv(id) { page = 'sales'; shell(); await openInvoice(id); }
async function cuAcctSave(id) {
  const { error } = await sb.rpc('set_customer_account', { p_customer: id, p_is_account: $('#ca_on').checked, p_limit: Number($('#ca_lim').value || 0),
    p_terms: Number($('#ca_terms').value || 0), p_hold: $('#ca_hold').checked });
  if (error) return msg(error.message);
  custs = []; msg('Account settings saved', true); await cuListView(); cuOpen(id);
}
async function cuPay(id) {
  const amt = Number($('#cp_amt').value);
  if (!(amt > 0)) return msg('Enter an amount');
  const { data, error } = await sb.rpc('receive_account_payment', { p_customer: id, p_method: $('#cp_method').value, p_amount: amt,
    p_yoco: $('#cp_yoco').checked, p_reference: $('#cp_ref').value.trim() || null, p_invoice: $('#cp_inv').value || null });
  if (error) return msg(error.message);
  msg('Payment applied to ' + data + ' invoice' + (data > 1 ? 's' : ''), true); await cuListView(); cuOpen(id);
}
async function cuStatement(id) {
  const { data, error } = await sb.rpc('customer_statement', { p_customer: id, p_from: $('#st_from').value, p_to: $('#st_to').value });
  if (error) return msg(error.message);
  let bal = Number(data.opening);
  const rows = data.rows.map(r => { bal += Number(r.debit) - Number(r.credit);
    return `<tr><td>${fdate(r.d)}</td><td>${esc(r.kind)}</td><td>${esc(r.ref)}</td><td>${Number(r.debit) ? R(r.debit) : ''}</td><td>${Number(r.credit) ? R(r.credit) : ''}</td><td>${R(bal)}</td></tr>`; }).join('');
  $('#st_out').innerHTML = `<div id="st_doc"><h3>${esc(data.customer.name)}</h3><p class="muted">${fdate($('#st_from').value)} to ${fdate($('#st_to').value)}</p>
    <table><tr><th>Date</th><th></th><th>Invoice</th><th>Charges</th><th>Payments</th><th>Balance</th></tr>
    <tr><td colspan="5">Balance brought forward</td><td>${R(data.opening)}</td></tr>${rows}
    <tr><td colspan="5"><b>Balance due</b></td><td><b>${R(bal)}</b></td></tr></table></div><button onclick="printStatement()">Print</button>`;
}
function printStatement() { $('#printArea').innerHTML = `<div class="doc"><h2>${esc(biz.trading_name || biz.name)} - Statement</h2>${$('#st_doc').innerHTML}</div>`; window.print(); }
async function cuAgeing() {
  const { data, error } = await sb.rpc('ageing_report');
  if (error) return msg(error.message);
  const t = k => data.reduce((a, r) => a + Number(r[k]), 0), ks = ['not_due', 'd1_30', 'd31_60', 'd61_90', 'd90_plus', 'bal_total'];
  $('#cu_out').innerHTML = `<div class="card" id="ag_doc"><h3>Ageing of open invoices</h3><table><tr><th>Customer</th><th>Not due</th><th>1-30 days</th><th>31-60</th><th>61-90</th><th>90+</th><th>Total</th><th>Limit</th></tr>
    ${data.map(r => `<tr><td>${esc(r.cust_name)}</td>${ks.map(k => `<td>${Number(r[k]) ? R(r[k]) : ''}</td>`).join('')}<td>${Number(r.cr_limit) > 0 ? R(r.cr_limit) : ''}</td></tr>`).join('')}
    <tr><td><b>Total</b></td>${ks.map(k => `<td><b>${R(t(k))}</b></td>`).join('')}<td></td></tr></table>
    <p class="muted">Days are counted past the due date. Invoices with no terms are due on the invoice date.</p></div>
    <div class="card"><button onclick="printAgeing()">Print</button></div>`;
}
function printAgeing() { $('#printArea').innerHTML = `<div class="doc"><h2>${esc(biz.trading_name || biz.name)}</h2>${$('#ag_doc').innerHTML}</div>`; window.print(); }

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') renderAuth(); });
load();
</script>
</body>
</html>
