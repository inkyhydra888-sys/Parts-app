<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parts App</title>
<style>
:root{--bg:#f6f7f9;--fg:#1a1d21;--card:#fff;--line:#dde1e6;--acc:#1f6feb;--mut:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8eaed;--card:#1a1e24;--line:#2c323a;--acc:#4c8dff;--mut:#9aa3ad}}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
nav{display:flex;gap:6px;padding:10px 20px}
main{padding:0 20px 40px;max-width:900px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:12px 0}
.narrow{max-width:380px;margin:80px auto}
label{display:block;margin:10px 0;font-size:13px;color:var(--mut)}
input,select{display:block;width:100%;padding:8px;margin-top:4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.chk{display:flex;gap:8px;align-items:center;color:var(--fg);font-size:14px}
.chk input{width:auto;margin:0}
button{padding:8px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
button.ghost,nav button{background:transparent;color:var(--fg);border:1px solid var(--line)}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
fieldset{border:1px solid var(--line);border-radius:8px;margin:10px 0}
.row{display:flex;gap:8px}
.muted{color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(
  'https://hqaeoikijehusngbbbrj.supabase.co',
  'sb_publishable_7c0PA5Gls3oFjRIp68ImCg_lO7vQuEL'
);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
const msg = (t, good) => {
  let b = $('#toast');
  if (!b) { b = document.createElement('div'); b.id = 'toast';
    b.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);max-width:90%;padding:10px 16px;border-radius:8px;background:#b42318;color:#fff;z-index:9;font-size:14px';
    document.body.appendChild(b); }
  b.textContent = t; b.style.background = good ? '#1a7f37' : '#b42318'; clearTimeout(b._t); b._t = setTimeout(() => b.remove(), 10000);
};
let me, biz, myPerms = new Set(), page = 'business', editId = null, staff = [];
const isOwner = () => me.role === 'owner';
const can = k => isOwner() || myPerms.has(k);

/* ---------- auth ---------- */
function renderAuth() {
  app.innerHTML = `<div class="card narrow"><h1>Parts App</h1>
    <label>Email<input id="em" type="email"></label>
    <label>Password<input id="pw" type="password"></label>
    <div class="row"><button onclick="signIn()">Sign in</button>
    <button class="ghost" onclick="signUp()">Create account</button></div></div>`;
}
async function signIn() {
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
  if (error) msg(error.message); else load();
}
async function signUp() {
  const { data, error } = await sb.auth.signUp({ email: $('#em').value, password: $('#pw').value });
  if (error) return msg(error.message);
  if (data.session) load(); else msg('Check your email to confirm your account, then sign in.');
}
async function signOut() { await sb.auth.signOut(); renderAuth(); }

function renderRegister() {
  app.innerHTML = `<div class="card narrow"><h1>Set up your business</h1>
    <label>Business name<input id="bn"></label>
    <label>Your full name<input id="fn"></label>
    <div class="row"><button onclick="register()">Create business</button>
    <button class="ghost" onclick="signOut()">Sign out</button></div></div>`;
}
async function register() {
  const bn = $('#bn').value.trim(), fn = $('#fn').value.trim();
  if (!bn || !fn) return msg('Enter both the business name and your full name');
  try {
    const { error } = await sb.rpc('register_business', { p_business_name: bn, p_full_name: fn });
    if (error) return msg('Could not create business: ' + error.message);
    me = null; await load();
    if (!me) msg('Business created, but your profile could not be loaded. Refresh the page.');
  } catch (e) { msg('Unexpected error: ' + e.message); }
}

/* ---------- load + shell ---------- */
async function load(retry = true) {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return renderAuth();
  const { data: p, error: pe } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (pe) msg('Could not load profile: ' + pe.message);
  if (!p) {
    const { data: joined, error: ie } = await sb.rpc('accept_invite');
    if (ie) msg('Invite check failed: ' + ie.message);
    if (joined && retry) return load(false);
    return renderRegister();
  }
  me = p;
  const { data: b } = await sb.from('businesses').select('*').eq('id', p.business_id).single();
  biz = b;
  const { data: perms } = await sb.rpc('my_permissions');
  myPerms = new Set(perms || []);
  go('business');
}
function shell() {
  app.innerHTML = `<header><b>${esc(biz.name)}</b><span>${esc(me.full_name)} (${me.role})
    <button class="ghost" onclick="signOut()">Sign out</button></span></header>
    <nav>${navPages().map(p =>
      `<button class="${p === page ? 'on' : ''}" onclick="go('${p}')">${p[0].toUpperCase() + p.slice(1)}</button>`).join('')}</nav>
    <main id="main"></main>`;
}
async function go(p) {
  page = p; editId = null; shell();
  await ({ business: pBusiness, branches: pBranches, stock: pStock, vehicles: pVehicles, staff: pStaff })[p]();
}

/* ---------- business ---------- */
const bizFields = [['name','Business name'],['trading_name','Trading name'],['vat_number','VAT number'],['vat_rate','VAT rate (%)'],['address','Address'],['phone','Phone'],['email','Email']];
async function pBusiness() {
  const ro = isOwner() ? '' : 'disabled';
  $('#main').innerHTML = `<div class="card"><h2>Business details</h2>
    ${bizFields.map(([k, l]) => `<label>${l}<input id="b_${k}" value="${esc(biz[k])}" ${ro}></label>`).join('')}
    ${isOwner() ? '<button onclick="saveBiz()">Save</button>' : '<p class="muted">Only the owner can edit these.</p>'}</div>`;
}
async function saveBiz() {
  const u = {};
  bizFields.forEach(([k]) => u[k] = $('#b_' + k).value.trim() || null);
  u.name = u.name || biz.name;
  u.vat_rate = Number(u.vat_rate || 15);
  const { data, error } = await sb.from('businesses').update(u).eq('id', biz.id).select().single();
  if (error) return msg(error.message);
  biz = data; shell(); pBusiness(); msg('Saved');
}

/* ---------- branches ---------- */
async function pBranches() {
  const { data } = await sb.from('branches').select('*').order('created_at');
  const canBr = ['owner', 'manager'].includes(me.role);
  $('#main').innerHTML = `<div class="card"><h2>Branches</h2><table>
    <tr><th>Name</th><th>Address</th><th>Status</th><th></th></tr>
    ${(data || []).map(b => `<tr><td>${esc(b.name)}</td><td>${esc(b.address)}</td>
      <td>${b.active ? 'Active' : 'Inactive'}</td>
      <td>${canBr ? `<button class="ghost" onclick="toggleBranch('${b.id}',${!b.active})">${b.active ? 'Deactivate' : 'Activate'}</button>` : ''}</td></tr>`).join('')}
    </table></div>
    ${canBr ? `<div class="card"><h3>Add a branch</h3>
      <label>Name<input id="nb_name"></label><label>Address<input id="nb_addr"></label>
      <button onclick="addBranch()">Add branch</button></div>` : ''}`;
}
async function addBranch() {
  const name = $('#nb_name').value.trim();
  if (!name) return msg('Enter a branch name');
  const { error } = await sb.from('branches').insert({ business_id: me.business_id, name, address: $('#nb_addr').value.trim() || null });
  if (error) msg(error.message); else pBranches();
}
async function toggleBranch(id, active) {
  const { error } = await sb.from('branches').update({ active }).eq('id', id);
  if (error) msg(error.message); else pBranches();
}

/* ---------- staff + permissions ---------- */
async function pStaff() {
  const { data } = await sb.from('profiles').select('*').order('full_name');
  staff = data || [];
  let inv = [];
  if (can('staff.manage_users')) {
    const r = await sb.from('staff_invites').select('*').is('accepted_at', null).order('created_at');
    inv = r.data || [];
  }
  $('#main').innerHTML = `<div class="card"><h2>Staff</h2><table>
    <tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr>
    ${staff.map(s => `<tr><td>${esc(s.full_name)}</td><td>${s.role}</td><td>${s.active ? 'Active' : 'Inactive'}</td>
      <td><button class="ghost" onclick="editStaff('${s.id}')">Open</button></td></tr>`).join('')}
    </table></div>${can('staff.manage_users') ? inviteCard(inv) : ''}<div id="editor"></div>`;
  if (editId) await renderEditor();
}
function inviteCard(inv) {
  return `<div class="card"><h3>Invite staff</h3>
    <label>Email<input id="i_email" type="email"></label>
    <label>Full name<input id="i_name"></label>
    <label>Role<select id="i_role">${['manager', 'rep', 'counter', 'technician', 'accounts'].map(r => `<option>${r}</option>`).join('')}</select></label>
    <button onclick="sendInvite()">Save invite</button>
    ${inv.length ? `<h4>Pending invites</h4><table>${inv.map(i => `<tr><td>${esc(i.full_name)}</td><td>${esc(i.email)}</td><td>${i.role}</td>
      <td><button class="ghost" onclick="cancelInvite('${i.id}')">Cancel</button></td></tr>`).join('')}</table>` : ''}
    <p class="muted">They sign up at ${esc(location.origin)} using this exact email and are added to your business automatically.</p></div>`;
}
async function sendInvite() {
  const email = $('#i_email').value.trim().toLowerCase(), full_name = $('#i_name').value.trim();
  if (!email || !full_name) return msg('Enter their email and full name');
  const { error } = await sb.from('staff_invites').insert({ business_id: me.business_id, branch_id: me.branch_id, email, full_name, role: $('#i_role').value });
  if (error) return msg(error.message);
  await pStaff();
}
async function cancelInvite(id) {
  const { error } = await sb.from('staff_invites').delete().eq('id', id);
  if (error) msg(error.message);
  await pStaff();
}
async function editStaff(id) { editId = id; await renderEditor(); $('#editor').scrollIntoView(); }
async function renderEditor() {
  const s = staff.find(x => x.id === editId); if (!s) return;
  const [{ data: cat }, { data: ticks }] = await Promise.all([
    sb.from('permissions').select('*').order('group_name').order('sort'),
    sb.from('user_permissions').select('permission_key').eq('user_id', s.id)]);
  const on = new Set((ticks || []).map(t => t.permission_key));
  const target = s.role === 'owner', self = s.id === me.id;
  const canEdit = can('staff.manage_users') && !target && !self;
  const canTick = can('staff.assign_permissions') && !target && !self;
  const dis = canEdit ? '' : 'disabled';
  const groups = {};
  (cat || []).forEach(p => (groups[p.group_name] = groups[p.group_name] || []).push(p));
  const showPerms = can('staff.assign_permissions');
  if (!showPerms) Object.keys(groups).forEach(k => delete groups[k]);
  $('#editor').innerHTML = `<div class="card"><h2>${esc(s.full_name)}</h2>
    <label>Full name<input id="e_name" value="${esc(s.full_name)}" ${dis}></label>
    <label>Phone<input id="e_phone" value="${esc(s.phone)}" ${dis}></label>
    <label>Role<select id="e_role" ${dis}>
      ${target ? '<option selected>owner</option>' : ''}
      ${['manager', 'rep', 'counter', 'technician', 'accounts'].map(r => `<option ${r === s.role ? 'selected' : ''}>${r}</option>`).join('')}
    </select></label>
    <label class="chk"><input type="checkbox" id="e_active" ${s.active ? 'checked' : ''} ${dis}> Active</label>
    ${canEdit ? `<button onclick="saveStaff('${s.id}')">Save details</button>` : ''}
    ${showPerms ? '<h3>Permissions</h3>' : ''}
    ${target && showPerms ? '<p class="muted">Owners always have every permission.</p>' : ''}
    ${Object.entries(groups).map(([g, ps]) => `<fieldset><legend>${esc(g)}</legend>
      ${ps.map(p => `<label class="chk"><input type="checkbox" ${on.has(p.key) ? 'checked' : ''}
        ${canTick && can(p.key) ? '' : 'disabled'} onchange="tick('${s.id}','${p.key}',this.checked)"> ${esc(p.label)}</label>`).join('')}
    </fieldset>`).join('')}
    ${canTick ? `<button class="ghost" onclick="resetPerms('${s.id}')">Reset to role defaults</button>` : ''}</div>`;
}
async function saveStaff(id) {
  const { error } = await sb.from('profiles').update({
    full_name: $('#e_name').value.trim(), phone: $('#e_phone').value.trim() || null,
    role: $('#e_role').value, active: $('#e_active').checked }).eq('id', id);
  if (error) return msg(error.message);
  await pStaff();
}
async function tick(uid, key, on) {
  const r = on
    ? await sb.from('user_permissions').insert({ user_id: uid, business_id: me.business_id, permission_key: key })
    : await sb.from('user_permissions').delete().eq('user_id', uid).eq('permission_key', key);
  if (r.error) msg(r.error.message);
  await renderEditor();
}
async function resetPerms(id) {
  const { error } = await sb.rpc('apply_role_defaults', { p_user: id });
  if (error) msg(error.message);
  await renderEditor();
}


/* ---------- stock + vehicles ---------- */
const navPages = () => ['business', 'branches',
  ...(can('stock.view') ? ['stock'] : []),
  ...(can('stripping.buy_car') ? ['vehicles'] : []),
  ...(can('staff.manage_users') || can('staff.assign_permissions') ? ['staff'] : [])];
const R = n => 'R ' + Number(n || 0).toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let stockQ = '', stripV = null, stripItems = [];

async function pStock() {
  $('#main').innerHTML = `<div class="card"><h2>Stock</h2>
    <div class="row"><input id="sq" placeholder="Search e.g. rear taillight grand cherokee" value="${esc(stockQ)}" onkeydown="if(event.key==='Enter')runSearch()">
    <button onclick="runSearch()">Search</button></div><div id="results"></div></div>
    <div id="partPanel"></div>${can('stock.edit') ? newPartCard() : ''}`;
  await runSearch();
}
async function runSearch() {
  stockQ = $('#sq').value;
  const { data, error } = await sb.rpc('search_parts', { q: stockQ }).limit(100);
  if (error) return msg(error.message);
  const vc = can('stock.view_cost'), costs = {};
  if (vc && data.length) {
    const r = await sb.from('part_costs').select('part_id,avg_cost').in('part_id', data.map(p => p.id));
    (r.data || []).forEach(c => costs[c.part_id] = c.avg_cost);
  }
  $('#results').innerHTML = data.length ? `<table><tr><th>Code</th><th>Part</th><th>Bin</th><th>Price</th>${vc ? '<th>Avg cost</th>' : ''}<th>Qty</th><th></th></tr>
    ${data.map(p => `<tr><td>${p.code}</td><td>${esc(p.name)}<div class="muted">${esc(p.specs)}</div></td><td>${esc(p.bin_location)}</td>
      <td>${R(p.sell_price)}</td>${vc ? `<td>${R(costs[p.id])}</td>` : ''}<td>${p.qty}</td>
      <td><button class="ghost" onclick="openPart('${p.id}')">Open</button></td></tr>`).join('')}</table>` : '<p class="muted">No parts found.</p>';
}
async function openPart(id) {
  const { data: p } = await sb.from('parts').select('*').eq('id', id).single();
  const { data: h } = await sb.rpc('part_history', { p_part: id });
  const vc = can('stock.view_cost'), ed = can('stock.edit'), adj = can('stock.adjust'), d = ed ? '' : 'disabled';
  $('#partPanel').innerHTML = `<div class="card"><h2>${p.code} - ${esc(p.name)}</h2>
    <label>Name<input id="p_name" value="${esc(p.name)}" ${d}></label>
    <label>Specs<input id="p_specs" value="${esc(p.specs)}" ${d}></label>
    <label>Bin location<input id="p_bin" value="${esc(p.bin_location)}" ${d}></label>
    <label>Selling price<input id="p_price" type="number" step="0.01" value="${p.sell_price}" ${d}></label>
    ${ed ? `<button onclick="savePart('${p.id}')">Save</button>` : ''}
    ${adj ? `<h3>Add stock</h3><div class="row"><input id="a_qty" type="number" placeholder="Quantity">
      <input id="a_cost" type="number" step="0.01" placeholder="Unit cost"><input id="a_src" placeholder="Supplier or source"></div>
      <button onclick="addStock('${p.id}')">Receive stock</button>` : ''}
    <h3>Stock history</h3><table><tr><th>Date</th><th>Type</th><th>Qty</th><th>Source</th>${vc ? '<th>Cost</th>' : ''}</tr>
    ${(h || []).map(m => `<tr><td>${new Date(m.created_at).toLocaleDateString()}</td><td>${m.kind}</td><td>${m.qty_change}</td>
      <td>${esc(m.source || m.note)}</td>${vc ? `<td>${m.unit_cost == null ? '' : R(m.unit_cost)}</td>` : ''}</tr>`).join('')}</table></div>`;
  $('#partPanel').scrollIntoView();
}
async function savePart(id) {
  const { error } = await sb.from('parts').update({ name: $('#p_name').value.trim(), specs: $('#p_specs').value.trim() || null,
    bin_location: $('#p_bin').value.trim() || null, sell_price: Number($('#p_price').value || 0) }).eq('id', id);
  if (error) return msg(error.message);
  msg('Saved', true); await runSearch();
}
async function addStock(id) {
  const q = Number($('#a_qty').value), c = $('#a_cost').value;
  const { error } = await sb.rpc('add_stock_movement', { p_part: id, p_qty: q, p_unit_cost: c === '' ? null : Number(c),
    p_kind: 'receive', p_source: $('#a_src').value.trim() || null, p_note: null });
  if (error) return msg(error.message);
  msg('Stock added', true); await runSearch(); await openPart(id);
}
function newPartCard() {
  return `<div class="card"><h3>Add a part manually</h3>
    <div class="row"><select id="np_kind"><option value="new">New (N)</option><option value="used">Used (U)</option></select>
    <input id="np_name" placeholder="Name"></div><label>Specs<input id="np_specs"></label>
    <div class="row"><input id="np_cat" placeholder="Category"><input id="np_bin" placeholder="Bin">
    <input id="np_price" type="number" step="0.01" placeholder="Selling price"></div>
    <button onclick="createPart()">Create part</button></div>`;
}
async function createPart() {
  const name = $('#np_name').value.trim();
  if (!name) return msg('Enter a part name');
  const { error } = await sb.rpc('create_part', { p_kind: $('#np_kind').value, p_name: name, p_specs: $('#np_specs').value.trim() || null,
    p_category: $('#np_cat').value.trim() || null, p_bin: $('#np_bin').value.trim() || null, p_price: Number($('#np_price').value || 0) });
  if (error) return msg(error.message);
  stockQ = name; await pStock(); msg('Part created. Use Open, then Add stock to receive quantity.', true);
}

const vLabel = v => [v.year, v.make, v.model, v.series].filter(Boolean).join(' ');
async function pVehicles() {
  const { data } = await sb.from('vehicles').select('*').order('created_at', { ascending: false });
  const f = [['make','Make'],['model','Model'],['series','Series (e.g. WK2)'],['year','Year'],['engine','Engine'],['transmission','Transmission'],
    ['vin','VIN'],['registration','Registration'],['colour','Colour'],['mileage','Mileage'],['purchase_price','Purchase price'],['extra_costs','Extra costs (towing etc.)']];
  $('#main').innerHTML = `<div class="card"><h2>Vehicles</h2>${(data || []).length ? `<table>
    <tr><th>Bought</th><th>Vehicle</th><th>Reg</th><th>Total cost</th><th>Status</th><th></th></tr>
    ${data.map(v => `<tr><td>${v.purchased_on}</td><td>${esc(vLabel(v))}</td><td>${esc(v.registration)}</td>
      <td>${R(Number(v.purchase_price) + Number(v.extra_costs))}</td><td>${v.status}</td>
      <td>${v.status === 'purchased' && can('stripping.import_parts') ? `<button onclick="startStrip('${v.id}')">Strip</button>` : ''}</td></tr>`).join('')}
    </table>` : '<p class="muted">No vehicles yet.</p>'}</div>
    <div class="card"><h3>Buy a vehicle for stripping</h3>
    ${f.map(([k, l]) => `<label>${l}<input id="v_${k}"></label>`).join('')}
    <button onclick="addVehicle()">Save vehicle</button></div>`;
}
async function addVehicle() {
  const g = k => $('#v_' + k).value.trim(), num = k => g(k) === '' ? null : Number(g(k));
  if (!g('make') || !g('model')) return msg('Enter at least the make and model');
  const { error } = await sb.from('vehicles').insert({ business_id: me.business_id, make: g('make'), model: g('model'),
    series: g('series') || null, year: num('year'), engine: g('engine') || null, transmission: g('transmission') || null,
    vin: g('vin') || null, registration: g('registration') || null, colour: g('colour') || null, mileage: num('mileage'),
    purchase_price: num('purchase_price') ?? 0, extra_costs: num('extra_costs') ?? 0 });
  if (error) return msg(error.message);
  await pVehicles(); msg('Vehicle saved. Click Strip to split it into parts.', true);
}

async function startStrip(id) {
  const { data: v } = await sb.from('vehicles').select('*').eq('id', id).single();
  const { data: t } = await sb.from('strip_template').select('*').order('sort');
  stripV = v;
  stripItems = (t || []).map(x => ({ category: x.category, name: x.name, on: true, price: '', bin: '' }));
  renderStrip();
}
function renderStrip() {
  const v = stripV, total = Number(v.purchase_price) + Number(v.extra_costs);
  const cats = [...new Set(stripItems.map(i => i.category))];
  $('#main').innerHTML = `<div class="card"><h2>Strip: ${esc(vLabel(v))}</h2>
    <p class="muted">Cost to spread: ${R(total)}. Untick parts that are damaged or missing. Enter a selling price on each ticked part: the cost is spread in proportion to these prices.</p>
    <div class="row"><input id="x_name" placeholder="Extra part for this car"><button class="ghost" onclick="addExtra()">Add</button></div></div>
    ${cats.map(c => `<div class="card"><h3>${esc(c)}</h3>${stripItems.map((i, ix) => i.category !== c ? '' : `
      <div class="row" style="align-items:center;margin:4px 0">
      <label class="chk" style="flex:2;margin:0"><input type="checkbox" ${i.on ? 'checked' : ''} onchange="toggleItem(${ix},this)"> ${esc(i.name)}</label>
      <input style="flex:1" type="number" step="0.01" placeholder="Price" value="${esc(i.price)}" ${i.on ? '' : 'disabled'} oninput="stripItems[${ix}].price=this.value">
      <input style="flex:1" placeholder="Bin" value="${esc(i.bin)}" ${i.on ? '' : 'disabled'} oninput="stripItems[${ix}].bin=this.value"></div>`).join('')}</div>`).join('')}
    <div class="card"><b id="stripCount">${stripItems.filter(i => i.on).length}</b> parts ticked
    <button onclick="confirmStrip()">Confirm and add to stock</button> <button class="ghost" onclick="go('vehicles')">Cancel</button></div>`;
}
function toggleItem(ix, el) {
  stripItems[ix].on = el.checked;
  el.closest('.row').querySelectorAll('input[type=number],input:not([type])').forEach(x => x.disabled = !el.checked);
  $('#stripCount').textContent = stripItems.filter(i => i.on).length;
}
function addExtra() {
  const n = $('#x_name').value.trim(); if (!n) return;
  stripItems.push({ category: 'Other', name: n, on: true, price: '', bin: '' }); renderStrip();
}
async function confirmStrip() {
  const items = stripItems.filter(i => i.on).map(i => ({ name: i.name, category: i.category, price: Number(i.price || 0), bin: i.bin || null }));
  if (!items.length) return msg('Tick at least one part');
  if (!items.some(i => i.price > 0) && !confirm('No selling prices entered, so the cost will be split equally. Continue?')) return;
  const { data, error } = await sb.rpc('strip_vehicle', { p_vehicle: stripV.id, p_items: items });
  if (error) return msg(error.message);
  stockQ = ''; await go('stock'); msg(data + ' parts added to stock', true);
}

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') renderAuth(); });
load();
</script>
</body>
</html>
